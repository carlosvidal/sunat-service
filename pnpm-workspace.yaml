# msgpackr-extract es un acelerador nativo opcional de msgpackr (dependencia de
# BullMQ). No aporta nada aquí y pnpm 11 aborta la instalación si su build queda
# pendiente de aprobación, así que se deniega explícitamente: msgpackr funciona
# igual en JavaScript puro.
allowBuilds:
  msgpackr-extract: false
