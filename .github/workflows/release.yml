name: Publicar imagen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    needs: imagen
    runs-on: ubuntu-latest
    # Solo la rama principal despliega; las etiquetas solo publican imagen.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Preparar la clave de despliegue
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Desplegar
        env:
          DESTINO: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          # Token efímero del propio job: la imagen sigue privada y el servidor
          # no guarda ninguna credencial permanente del registro.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -o BatchMode=yes "$DESTINO" "cd /opt/sunat-service \
            && echo '$GHCR_TOKEN' | docker login ghcr.io -u ${{ github.actor }} --password-stdin \
            && docker compose pull \
            && docker compose run --rm --no-deps api node dist/index.js --migrate \
            && docker compose up -d \
            && docker logout ghcr.io \
            && docker image prune -f"

      - name: Verificar que quedó sano
        run: |
          for intento in $(seq 1 10); do
            estado=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://sunat.hotelpms.work/health || true)
            if [ "$estado" = "200" ]; then
              echo "Servicio sano tras el despliegue."
              curl -s https://sunat.hotelpms.work/health
              exit 0
            fi
            echo "Intento $intento: respuesta $estado; reintentando..."
            sleep 10
          done
          echo "El servicio no respondió 200 tras el despliegue."
          exit 1
